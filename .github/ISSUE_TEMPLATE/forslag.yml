name: Forslag til forbedring
description: En idé til siden, teksten eller søgningen.
title: "[Forslag] "
labels: ["forslag"]
body:
  - type: markdown
    attributes:
      value: |
        Sagen er offentlig. Skriv ikke personlige helbredsoplysninger.
        Du skal have en GitHub-konto for at oprette sagen.
  - type: textarea
    id: forslag
    attributes:
      label: Forslaget
    validations:
      required: true
  - type: input
    id: side
    attributes:
      label: Side
      description: Valgfri adresse, hvis forslaget gælder en bestemt side.
  - type: checkboxes
    id: vision
    attributes:
      label: Vision
      options:
        - label: Passer det med VISION.md?
          required: true
